[package]
name = "itir-dioxus"
version = "0.1.0"
edition = "2024"
publish = false
description = "Dioxus + wgpu operator workbench for the ITIR/SensibLaw suite"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
gpu = ["dep:wgpu"]

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
serde = { version = "1.0", features = ["derive"] }
wgpu = { version = "29.0.3", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
