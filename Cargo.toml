[package]
name = "itir-dioxus"
version = "0.1.0"
edition = "2024"
publish = false
description = "Dioxus + wgpu operator workbench for the ITIR/SensibLaw suite"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "production-data"]
web = ["dioxus/web"]
gpu = ["dep:wgpu", "dep:pollster"]
production-data = ["dep:sensiblaw-reader-model", "dep:sensiblaw-pg-source-store", "dep:sensiblaw-legal-runtime", "dep:postgres"]

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = { version = "29.0.3", optional = true }
pollster = { version = "0.4", optional = true }
postgres = { version = "0.19", optional = true }
sensiblaw-reader-model = { git = "https://github.com/chboishabba/slr", rev = "741aee32bb5613e845728de37d31a9a415eb27de", package = "sensiblaw-reader-model", optional = true }
sensiblaw-pg-source-store = { git = "https://github.com/chboishabba/slr", rev = "741aee32bb5613e845728de37d31a9a415eb27de", package = "sensiblaw-pg-source-store", optional = true }
sensiblaw-legal-runtime = { git = "https://github.com/chboishabba/slr", rev = "741aee32bb5613e845728de37d31a9a415eb27de", package = "sensiblaw-legal-runtime", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"

[[example]]
name = "au_legal_gpu_receipt"
path = "examples/au_legal_gpu_receipt.rs"
required-features = ["gpu"]

[[example]]
name = "m11_comparative_gpu_receipt"
path = "examples/m11_comparative_gpu_receipt.rs"
required-features = ["gpu"]

[[example]]
name = "m11_postgres_comparative_workbench"
path = "examples/m11_postgres_comparative_workbench.rs"
required-features = ["production-data"]

[[example]]
name = "m11_postgres_comparative_gpu_receipt"
path = "examples/m11_postgres_comparative_gpu_receipt.rs"
required-features = ["production-data", "gpu"]

[[example]]
name = "m11_postgres_pabai_gpu_receipt"
path = "examples/m11_postgres_pabai_gpu_receipt.rs"
required-features = ["production-data", "gpu"]
